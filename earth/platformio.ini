; M5Stack StopWatch (C152) - 回転する地球
; 設定は公式ドキュメント (docs.m5stack.com/en/core/StopWatch) の PlatformIO 例に準拠

[env:m5stack-stopwatch]
platform = espressif32 @ 6.12.0
board = esp32s3box
framework = arduino
board_build.partitions = default_16MB.csv
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
board_build.arduino.memory_type = qio_opi
monitor_speed = 115200

; テクスチャ (tools/make_texture.py で生成) をファームに埋め込む
board_build.embed_files =
    data/earth_day.rgb565
    data/earth_night.gray8
    data/earth_cloud.gray8

build_unflags = -Os
build_flags =
    -O2
    -DESP32S3
    -DBOARD_HAS_PSRAM
    -DCORE_DEBUG_LEVEL=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1

lib_deps =
    M5Unified = https://github.com/m5stack/M5Unified
    M5GFX = https://github.com/m5stack/M5GFX
    M5PM1 = https://github.com/m5stack/M5PM1
    M5IOE1 = https://github.com/m5stack/M5IOE1
